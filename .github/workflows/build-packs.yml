# Builds the SkyNav region packs on GitHub's servers (fast internet, nothing to install on your PC)
# and publishes them as a release. Phones read:
#   https://github.com/<you>/<repo>/releases/latest/download/packs.json
# Start it: repository → Actions → "Build map packs" → Run workflow.
name: Build map packs

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this region id (empty = all regions in regions.json)"
        required: false
        default: ""

permissions:
  contents: write   # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (all-India map + 38 packs need ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install contour-line tools (GDAL, tippecanoe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin tippecanoe

      - name: Build packs
        env:
          GITHUB_TOKEN: ${{ github.token }}   # to fetch the pmtiles tool without hitting rate limits
        run: |
          pip install pmtiles pillow numpy
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python build_packs.py --ram 12 --cleanup --only "${{ github.event.inputs.only }}"
          else
            python build_packs.py --ram 12 --cleanup
          fi
          df -h /
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="maps-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/*.pmtiles out/packs.json \
            --title "Map packs $(date +%Y-%m-%d)" \
            --notes "SkyNav region packs. Map data © OpenStreetMap contributors (ODbL), elevation Mapzen/AWS Terrain Tiles." \
            --latest
          echo "Packs address for the app:"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/packs.json"
